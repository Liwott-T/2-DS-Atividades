<!DOCTYPE html>
<html lang="pt-br">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <title>RPG Legal</title>
</head>
<body>
    <div class="container">
        <div class="card">
            <!-- Cabeçalho -->
            <div class="card-header text-center">RPG Legal - Criado por Liwottins</div>
            <!-- Tela do Jogo -->
            <div class="card-body" id="background" style="background-image: url(''); background-size: cover;">
                <div class="row">
                    <!-- Status Herói -->
                    <div class="col">
                        <ul class="list-group float-end text-center" style="width: 225px;">
                            <!-- Nome Herói -->
                            <li class="list-group-item"><strong id="nome_heroi"></strong></li>
                            <!-- Título Herói -->
                            <li class="list-group-item"><span id="titulo_heroi"></span></li>
                            <li class="list-group-item">❤️ <progress id="hp-hero" value="100" max="100" style="accent-color: red;"></progress></li>
                            <li class="list-group-item">🌀 <progress id="mana-hero" value="100" max="100"></progress></li>
                            <li class="list-group-item">⚡ <progress id="energia-hero" value="0" max="100" style="accent-color: yellow"></progress></li>
                        </ul> 
                    </div>
                    <!-- Status Chefe -->
                    <div class="col">
                        <ul class="list-group float-start text-center" style="width: 225px;">
                            <!-- Nome Herói -->
                            <li class="list-group-item"><strong id="nome_chefe"></strong></li>
                            <!-- Título Herói -->
                            <li class="list-group-item"><span id="titulo_chefe"></span></li>
                            <li class="list-group-item">❤️ <progress value="100" max="100" style="accent-color: red;"></progress></li>
                            <li class="list-group-item">⚡ <progress value="0" max="100" style="accent-color: yellow"></progress></li>
                        </ul>
                    </div>
                </div>
                <div class="row">
                    <!-- IMG Hero -->
                    <div class="col text-end">
                        <img id="imagem_heroi" width="250px" height="200px" style="margin-top: 300px;">
                        <div id="controles"></div>
                    </div>
                    <!-- IMG Boss -->
                    <div class="col text-start">
                        <img id="imagem_chefe" width="500px" height="500px"> 
                    </div>
                </div>
            </div>
            <!-- Rodapé -->
            <div class="card-footer"></div>
        </div> <!-- Fim Card -->
    </div> <!-- Fim Container -->
</body>
<script src="javascript.js"></script>
</html>
