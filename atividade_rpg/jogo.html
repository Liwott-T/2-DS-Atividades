<!DOCTYPE html>
<html lang="pt-br">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <title>RPG Legal</title>
</head>
<body>
    <div class="container">
        <div class="card">
            <!-- Cabeçalho -->
            <div class="card-header text-center">RPG Legal - Criado por Liwottins</div>
            <!-- Tela do Jogo -->
            <div class="card-body" style="background-image: url('assets/gt_background.png'); background-size: cover;">
                <div class="row">
                    <!-- Status Herói -->
                    <div class="col">
                        <ul class="list-group float-end text-center" style="width: 225px;">
                            <!-- Nome Herói -->
                            <li class="list-group-item"><span id="nome_heroi"></span></li>
                            <!-- Título Herói -->
                            <li class="list-group-item"><span id="titulo_heroi"></span></li>
                            <li class="list-group-item">❤️ <progress value="100" max="100" style="accent-color: red;"></progress></li>
                            <li class="list-group-item">🌀 <progress value="100" max="100"></progress></li>
                            <li class="list-group-item">⚡ <progress value="0" max="100" style="accent-color: yellow"></progress></li>
                        </ul> 
                    </div>
                    <!-- Status Chefe -->
                    <div class="col">
                        <ul class="list-group float-start text-center" style="width: 225px;">
                            <!-- Nome Herói -->
                            <li class="list-group-item"><span id="nome_chefe"></span></li>
                            <!-- Título Herói -->
                            <li class="list-group-item"><span id="titulo_chefe"></span></li>
                            <li class="list-group-item">❤️ <progress value="100" max="100" style="accent-color: red;"></progress></li>
                            <li class="list-group-item">⚡ <progress value="0" max="100" style="accent-color: yellow"></progress></li>
                        </ul>
                    </div>
                </div>
                <div class="row">
                    <!-- IMG Hero -->
                    <div class="col text-end">
                        <img id="imagem_heroi" src="" width="200px" height="200px">
                    </div>
                    <!-- IMG Boss -->
                    <div class="col text-start">
                        <img id="imagem_chefe" src="" width="500px" height="500px"> 
                    </div>
                </div>
            </div>
            <!-- Rodapé -->
            <div class="card-footer"></div>
        </div> <!-- Fim Card -->
    </div> <!-- Fim Container -->
</body>
</html>

<script>
    
    var nome_heroi = "vazio"
    var titulo_heroi = "vazio"
    var nome_chefe = "vazio"

    var id_heroi = 0

    do {
        id_heroi = parseFloat(prompt(`Escolha um herói (Insira apenas o número)
        1. Mayreel
        2. Heroi2
        3. Heroi3`))
    } while (id_heroi !== 1 && id_heroi !== 2 && id_heroi !== 3)

    switch (id_heroi) {
        case 1:
            nome_heroi = "Mayreel"
            titulo_heroi = "A Besta Divina da Colheita"
            imagem_heroi = "assets/mayreel_idle.gif"
            nome_chefe = "Besta das Sombras"
            titulo_chefe = ""
            imagem_chefe = "assets/shadow_beast.gif"
            imagem_fundo = "assets/gt_background"
            break
        case 2:
            nome_heroi = "Heroi 2"
            titulo_heroi = "Titulo 2"
            imagem_heroi = 2
            nome_chefe = "Chefe 2"
            titulo_chefe = "Titulo 2"
            imagem_chefe = 2
            imagem_fundo = 2
            break
        case 3:
            nome_heroi = "Heroi 3"
            titulo_heroi = "Titulo 3"
            imagem_heroi = 3
            nome_chefe = "Chefe 3"
            titulo_chefe = "Titulo 3"
            imagem_chefe = 3
            imagem_fundo = 3
            break
    }

    document.getElementById("nome_heroi").innerText = nome_heroi
    document.getElementById("titulo_heroi").innerText = titulo_heroi
    document.getElementById("imagem_heroi").src = imagem_heroi
    document.getElementById("nome_chefe").innerText = nome_chefe
    document.getElementById("titulo_chefe").innerText = titulo_chefe
    document.getElementById("imagem_chefe").src = imagem_chefe

</script>
